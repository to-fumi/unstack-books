# ローカル開発用の compose 定義
# パスはこのファイル (local/) からの相対パス。プロジェクトルートで `make up` を使うのがおすすめ
name: unstack-books

services:
  api:
    build:
      context: ..
      dockerfile: local/Dockerfile
    # 開発用: ホットリロード付きで起動
    command: fastapi dev src/main.py --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ../src:/workspace/src
      - ../migrations:/workspace/migrations
      - ../alembic.ini:/workspace/alembic.ini
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 以降のイメージは /var/lib/postgresql をマウントする
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
